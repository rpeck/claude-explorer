name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      playwright:
        description: 'Run the Playwright e2e job'
        type: boolean
        default: true
  workflow_call:   # lets release.yml run this exact suite as a pre-publish gate
    inputs:
      playwright:
        description: |
          Run the Playwright e2e job. Defaults to true; release.yml
          consumes that default so the e2e suite gates publish. The
          input is kept (vs. unconditionally running) so a future
          workflow_dispatch can re-skip it for debugging without
          editing release.yml again.
        type: boolean
        required: false
        default: true

# Both jobs name their Ubuntu version. GitHub moves ubuntu-latest to 26.04
# between 2026-10-19 and 2026-11-19, so with ubuntu-latest a run could get
# either image. install-matrix.yml also tests Ubuntu 24.04.
jobs:
  python:
    name: Python (backend + fetcher + mcp_server pytest)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      - name: Sync Python deps
        run: uv sync --extra dev

      # Every job runs a section of scripts/check.py, the same list that the
      # pre-commit hook and a local run use, so CI and the local checks
      # cannot drift apart (2026-10-24). This section: ruff, compileall,
      # pytest, and the serial (wall-clock) tests.
      - name: Checks (scripts/check.py --only python)
        run: uv run python scripts/check.py --only python

  frontend:
    name: Frontend (tsc, eslint, vitest, React Doctor)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # React Doctor reports only new errors: it diffs against main

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      # Until 2026-10-24 no CI job ran vitest, tsc, eslint, or React Doctor.
      - name: Checks (scripts/check.py --only frontend)
        run: python3 scripts/check.py --only frontend

  e2e:
    name: Playwright (fixture mode)
    # Skipped only when an explicit `playwright: false` is passed via
    # workflow_call / workflow_dispatch. On push and pull_request the
    # `inputs` context is unavailable and `inputs.playwright` is null;
    # GitHub Actions performs loose-equality with type coercion to
    # number, so `null != false` evaluates to `0 != 0` → false → the
    # job silently SKIPS. (This bit us on the 2026-06-04 push
    # immediately after restoring the release gate: Tests #34 on main
    # went "green" in 1m 8s because only Python ran; Release #5
    # validated e2e correctly because workflow_call populates inputs
    # from the `default: true` declaration above.)
    #
    # `toJSON(inputs.playwright)` serializes null/true/false to the
    # literal strings 'null'/'true'/'false', so the comparison is
    # type-stable across all four triggers (push, pull_request,
    # workflow_dispatch, workflow_call) and skips only on an explicit
    # `playwright: false` opt-out.
    if: ${{ toJSON(inputs.playwright) != 'false' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      - name: Sync Python deps
        run: uv sync --extra dev

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # The e2e section of scripts/check.py:
      # 1. The fixture generator is deterministic, so a new run must leave
      #    backend/tests/fixtures unchanged. That catches out-of-date or
      #    hand-edited fixtures before the e2e suite runs.
      # 2. Playwright. playwright.config.ts starts a real FastAPI backend in
      #    fixture mode beside Vite (its webServer array injects
      #    CLAUDE_EXPLORER_DATA_DIR, CLAUDE_DIR, CLAUDE_DESKTOP_APP_DIR, and
      #    the DISABLE_* flags).
      - name: Checks (scripts/check.py --only e2e)
        run: uv run python scripts/check.py --only e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
