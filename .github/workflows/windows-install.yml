# Windows install verification, on both processor architectures.
#
# Why this exists: every job in test.yml runs on ubuntu-latest, so no Windows
# code path has ever run automatically. The README's Windows instructions were
# also never executed anywhere. This workflow runs those documented commands on
# real Windows runners, so the documentation is tested, not just the code.
#
# Runner coverage:
#   windows-latest  -> x86_64 (Intel and AMD)
#   windows-11-arm  -> ARM64 (Copilot+ PCs, Surface Pro X, Snapdragon X)
# Both are free for public repositories.
#
# Triggers are a push to the ci/windows-install branch and manual dispatch.
# Neither disturbs the release pipeline. Add a pull_request trigger once the
# first runs are green. On a push run `inputs.source` is empty, which the steps
# treat as the checkout path.
#
# Security note: no untrusted value reaches a `run:` block. The only input is
# a validated `choice`, and it is passed through `env:` rather than
# interpolated into the script body. Matrix values are static text from this
# file. No `github.event.*` field is read anywhere.
#
# What this CANNOT cover, because each needs a GUI or an interactive login:
#   C3-W  drag the .mcpb bundle into Claude Desktop
#   C6-W  mitmproxy plus Claude Desktop credential capture
#   real credential capture (the browser login is interactive by design)
#   C4-W  PDF export, until a GTK runtime install is added here

name: Windows install

on:
  # Push trigger on the CI branch so this can be iterated without landing on
  # main first. A workflow_dispatch job is only selectable once the file is on
  # the default branch; a push trigger has no such restriction.
  push:
    branches: [ci/windows-install]
  workflow_dispatch:
    inputs:
      source:
        description: "Install from this checkout or from the published PyPI package"
        type: choice
        options: [checkout, pypi]
        default: checkout

permissions:
  contents: read

jobs:
  install:
    name: Install + smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            # The default interpreter is fine on x86_64.
            python: "3.13"
          - arch: arm64
            runner: windows-11-arm
            # Windows ARM64 has no wheels for cryptography, httptools, Brotli
            # or mitmproxy, so install against an x86_64 interpreter. It runs
            # under Prism translation. This is the exact string the README
            # tells an ARM user to run.
            python: "cpython-3.13-windows-x86_64-none"

    env:
      SOURCE: ${{ inputs.source }}
      PYSPEC: ${{ matrix.python }}

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Put the uv tool directory on PATH
        run: |
          "$env:USERPROFILE\.local\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install claude-explorer
        run: |
          $src = if ($env:SOURCE -eq "pypi") { "claude-explorer" } else { "." }
          Write-Host "Installing from: $src  (python $env:PYSPEC)"
          uv tool install $src --python "$env:PYSPEC"
          if ($LASTEXITCODE -ne 0) { throw "uv tool install failed" }

      - name: Report the interpreter that was actually used
        run: |
          # On ARM this must report AMD64, which proves the Prism path works.
          $py = uv python find "$env:PYSPEC"
          Write-Host "interpreter: $py"
          & $py -c "import platform,sys; print('machine:', platform.machine()); print('version:', sys.version)"

      - name: CLI responds
        run: |
          claude-explorer --version
          if ($LASTEXITCODE -ne 0) { throw "claude-explorer --version failed" }
          $help = claude-explorer --help | Out-String
          foreach ($cmd in @("capture", "fetch", "serve", "install-watcher", "reindex-search")) {
            if ($help -notmatch $cmd) { throw "subcommand missing from --help: $cmd" }
          }
          Write-Host "all five subcommands present"

      - name: Install the Chromium build for credential capture
        run: |
          # This is the one-time browser download the README calls for. It is
          # the most common first-run failure, so it is worth testing.
          if ($env:SOURCE -eq "pypi") {
            uvx --from claude-explorer --python "$env:PYSPEC" playwright install chromium
          } else {
            uv sync --python "$env:PYSPEC"
            uv run playwright install chromium
          }
          if ($LASTEXITCODE -ne 0) { throw "playwright install chromium failed" }

      - name: Chromium resolves to a real file
        if: ${{ inputs.source != 'pypi' }}
        run: |
          uv run python -c "import os; from playwright.sync_api import sync_playwright; p = sync_playwright().start(); path = p.chromium.executable_path; p.stop(); print('chromium:', path); assert os.path.exists(path), 'chromium missing at ' + path"

      - name: Server starts and answers
        run: |
          $data = Join-Path $env:RUNNER_TEMP "ce-data"
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $env:CLAUDE_EXPLORER_DATA_DIR = $data

          $proc = Start-Process -FilePath "claude-explorer" `
            -ArgumentList "serve", "--port", "8765" `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput "serve.out.log" `
            -RedirectStandardError  "serve.err.log"

          # Poll for a real readiness signal. Never assume a fixed sleep is
          # long enough on a cold runner.
          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 `
                     -Uri "http://127.0.0.1:8765/api/config"
              if ($r.StatusCode -eq 200) {
                Write-Host "/api/config 200 after $i polls"
                Write-Host $r.Content
                $ready = $true
                break
              }
            } catch { Start-Sleep -Seconds 2 }
          }

          if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          if (-not $ready) {
            Write-Host "--- stdout ---"; Get-Content serve.out.log -ErrorAction SilentlyContinue
            Write-Host "--- stderr ---"; Get-Content serve.err.log -ErrorAction SilentlyContinue
            throw "server never answered on port 8765"
          }

      - name: Watcher install, query, uninstall
        run: |
          # C2-W. v1.0.9 dropped /RL HIGHEST so this must work without admin.
          claude-explorer install-watcher
          if ($LASTEXITCODE -ne 0) { throw "install-watcher failed" }

          schtasks /Query /TN ClaudeExplorerCCWatcher
          if ($LASTEXITCODE -ne 0) { throw "scheduled task was not registered" }

          claude-explorer install-watcher --uninstall
          if ($LASTEXITCODE -ne 0) { throw "install-watcher --uninstall failed" }

          # Bidirectional check: the task must actually be gone afterwards.
          schtasks /Query /TN ClaudeExplorerCCWatcher 2>$null
          if ($LASTEXITCODE -eq 0) { throw "scheduled task still present after uninstall" }
          Write-Host "watcher lifecycle verified"
          # That query is EXPECTED to fail, which leaves $LASTEXITCODE at 1.
          # The pwsh wrapper uses the last exit code as the step result, so
          # clear it explicitly or a passing step reports failure.
          exit 0

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: serve-logs-${{ matrix.arch }}
          path: serve.*.log
          if-no-files-found: ignore

  pytest:
    name: pytest on Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            python: "3.13"
          - arch: arm64
            runner: windows-11-arm
            python: "cpython-3.13-windows-x86_64-none"

    env:
      PYSPEC: ${{ matrix.python }}

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync --extra dev --python "$env:PYSPEC"

      - name: Run the Python suite
        run: |
          # This suite has never run on Windows. Expect real findings on the
          # first pass: path handling, platform guards, and launcher shape.
          # Do not pipe this through Select-Object or Tail. A pipeline hides
          # the runner's exit status and turns a failure into a pass.
          # -n 0 disables pytest-xdist. Every test passes on Windows, but the
          # xdist controller then hangs waiting for its workers to exit and is
          # interrupted at threading shutdown, which fails the step with a
          # fully green suite. Serial costs a little wall time and removes the
          # whole class of shutdown races.
          uv run pytest backend/tests fetcher/tests mcp_server/tests -q -n 0
          if ($LASTEXITCODE -ne 0) { throw "pytest failed with exit code $LASTEXITCODE" }
