name: Codex verification
description: Report a check of the Codex source on a work machine.
title: "Codex verification: "
labels: ["codex-verification"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for this check. Work transcripts must stay on your machine.

        - Do not paste message text, file paths, session titles, or session ids.
        - Attach only screenshots of the synthetic fixture corpus, never of your own sessions.
        - The shape report below holds counts only, so you can paste it as it is.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Claude Explorer version (`claude-explorer --version`), Codex CLI version, and OS.
      placeholder: "claude-explorer 1.2.0, codex-cli 0.164.0, macOS 15.6"
    validations:
      required: true
  - type: textarea
    id: shape_report
    attributes:
      label: Shape report
      description: Paste the output of `uv run claude-explorer codex-report`.
      render: text
    validations:
      required: true
  - type: dropdown
    id: source_filter
    attributes:
      label: Source filter ("Codex")
      description: '"Codex" is in the filter list, and it shows only Codex sessions.'
      options: ["Pass", "Fail"]
    validations:
      required: true
  - type: input
    id: source_filter_note
    attributes:
      label: Source filter note
  - type: dropdown
    id: project_grouping
    attributes:
      label: Project grouping
      description: 'Codex sessions group by their project folder.'
      options: ["Pass", "Fail"]
    validations:
      required: true
  - type: input
    id: project_grouping_note
    attributes:
      label: Project grouping note
  - type: dropdown
    id: search_jump
    attributes:
      label: Search and the jump to a match
      description: 'A search for a word from a Codex session finds it, and a click on the result jumps to the message.'
      options: ["Pass", "Fail"]
    validations:
      required: true
  - type: input
    id: search_jump_note
    attributes:
      label: Search note
  - type: dropdown
    id: detail_controls
    attributes:
      label: Detail controls
      description: 'The header shows Thread ID, Codex name, and Codex home, and each copy button copies its value; Show Tools shows and hides tool calls; notices show above the messages.'
      options: ["Pass", "Fail"]
    validations:
      required: true
  - type: input
    id: detail_controls_note
    attributes:
      label: Detail controls note
  - type: dropdown
    id: export
    attributes:
      label: Export (copy, Markdown, PDF)
      description: 'Copy as Markdown, Markdown, and PDF work for a Codex session, and the export starts with the Thread ID, Codex name, and Codex home lines.'
      options: ["Pass", "Fail"]
    validations:
      required: true
  - type: input
    id: export_note
    attributes:
      label: Export note
  - type: dropdown
    id: mcp_tools
    attributes:
      label: MCP tools
      description: 'In Codex (or another MCP client), `list_sessions` with `source="CODEX"` lists the Codex sessions, and `get_session_outline` shows one; an unknown source gives an error.'
      options: ["Pass", "Fail"]
    validations:
      required: true
  - type: input
    id: mcp_tools_note
    attributes:
      label: MCP tools note
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (synthetic fixture corpus only)
      description: Never attach a screenshot of your own sessions.
